name: record

# Primary trigger: the Cloudflare Worker (worker/) dispatches this workflow when work falls
# due. The daily `schedule` below is only a backup: GitHub may delay or drop scheduled runs.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "tick = due work only; daily = refresh sources, benchmark, verify, scoreboard, then tick"
        type: choice
        options: [tick, daily]
        default: tick
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

# One ledger writer at a time. GitHub keeps at most one run pending per group: a newer
# dispatch replaces an older pending one. That's safe here because every run does all work
# that is due, and a dropped daily is caught by the watchdog's 26-hour rule and the backup
# schedule. The ledger itself refuses stale writers (expected_head_seq), whatever GitHub does.
concurrency:
  group: recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MODE: ${{ inputs.mode || 'daily' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache in the job that holds secrets: a poisoned cache can't persist here.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false

      - name: Install
        run: uv sync --locked --no-dev

      - name: Record
        env:
          NEARPOST_ENV: production
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          HEALTHCHECKS_PING_KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: .venv/bin/nearpost "$MODE"

      # Covers failures Python can't report itself: install errors, missing secrets, timeouts.
      # If Python already pinged /fail, this second ping is harmless.
      - name: Report failure to healthchecks
        if: failure() || cancelled()
        env:
          HEALTHCHECKS_PING_KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 --retry 3 -X POST \
            --data-raw "record ($MODE) failed or was cancelled before completing: $RUN_URL" \
            "https://hc-ping.com/${HEALTHCHECKS_PING_KEY}/nearpost-${MODE}/fail?create=1"
