[project]
name = "nearpost-pipeline"
version = "0.1.0"
description = "Nearpost recording job: odds and FPL snapshots, baseline forecasts, and a hash-chained ledger."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.scripts]
nearpost = "nearpost.cli:main"

[dependency-groups]
dev = [
    "penaltyblog>=1.12",  # test oracle for our Dixon-Coles and Shin; never a runtime dependency
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nearpost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: hits real public endpoints (run explicitly with -m live)"]
# penaltyblog 1.12 sets ndarray.shape, deprecated in NumPy 2.5; harmless until upstream fixes it.
filterwarnings = ["ignore:Setting the shape:DeprecationWarning:penaltyblog"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
